# v2 filename intentionally creates a fresh GitHub Actions schedule registration.
name: Publish Market Snapshot

on:
  workflow_dispatch:

concurrency:
  group: publish-market-snapshot
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub-hosted runners are disposable. Keep Playwright's browser outside
      # node_modules so actions/cache can restore it on the next run.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Restore Playwright Chromium
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        env:
          CI: true
        # The npm cache is restored above. Avoid the retired audit endpoint and
        # prefer cached tarballs so scheduled runs spend their time collecting.
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Collect the market snapshot
        env:
          CI: true
          FOCUS_EMAIL: ${{ secrets.FOCUS_EMAIL }}
          FOCUS_PASSWORD: ${{ secrets.FOCUS_PASSWORD }}
          FOCUS_LOGIN_URL: https://focus.marketech.com.au/#/login
          COOKIE_UPDATE_URL: ${{ secrets.COOKIE_UPDATE_URL }}
          COOKIE_UPDATE_TOKEN: ${{ secrets.COOKIE_UPDATE_TOKEN }}
          COOKIE_UPDATE_SOURCE: github-actions-snapshot
          MARKET_SNAPSHOT_OUTPUT_DIR: site/snapshot/latest
          MARKET_SNAPSHOT_INTERVAL_MS: 1200000
          MARKET_SNAPSHOT_OPEN_HOUR: 9
          MARKET_SNAPSHOT_OPEN_MINUTE: 30
          MARKET_SNAPSHOT_CLOSE_HOUR: 17
          MARKET_SNAPSHOT_CLOSE_MINUTE: 0
          COLLECTOR_MARKET_TIMEZONE: Australia/Sydney
        run: npm run snapshot:once -- --force

      - name: Generate partner HTML renders
        env:
          SNAPSHOT_RENDER_SOURCE_DIR: site/snapshot/latest
          SNAPSHOT_RENDER_OUTPUT_DIR: site/snapshot-renders/latest
        run: node scripts/generate-snapshot-render-assets.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
